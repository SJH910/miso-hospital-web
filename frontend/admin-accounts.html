<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미소 병원 - 계정 관리</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-page">

    <header class="site-header">
        <a href="index.html" class="brand" style="text-decoration:none;">
            <span class="brand-mark">+</span>
            미소병원
        </a>
        <nav class="main-nav">
            <a href="admin-reservations.html">예약 관리</a>
            <a href="admin-board.html">문의 답변</a>
            <span class="user-chip" id="userInfo"></span>
            <button type="button" class="btn-logout" id="logoutBtn">로그아웃</button>
        </nav>
    </header>

    <div class="page-header">
        <p class="breadcrumb"><a href="index.html">홈</a> &gt; 계정 관리</p>
        <h1>계정 관리</h1>
        <p style="color:#6b7785;">환자 계정을 등록하고, 계정 역할을 관리할 수 있습니다.</p>
    </div>

    <div class="page-body">
        <section class="panel write-section" id="registerSection">
            <h3>환자 등록</h3>
            <p style="color:#6b7785; font-size:14px;">직접 방문 접수 등으로 환자를 대신 등록할 때 사용합니다. 등록된 계정의 역할은 항상 "환자"로 고정됩니다.</p>
            <div class="input-group">
                <label for="regUsername">아이디</label>
                <input type="text" id="regUsername" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="regPassword">비밀번호</label>
                <input type="password" id="regPassword" autocomplete="new-password">
            </div>
            <div class="input-group">
                <label for="regName">이름</label>
                <input type="text" id="regName" autocomplete="off">
            </div>
            <div class="input-group">
                <label for="regRrn">주민등록번호</label>
                <input type="text" id="regRrn" placeholder="'-' 없이 숫자만 입력" autocomplete="off">
            </div>
            <button type="button" id="registerButton" class="btn-primary">환자 등록</button>
        </section>

        <section class="panel list-section" id="accountListSection" style="display:none;">
            <h3>전체 계정 목록</h3>
            <table class="board-table">
                <thead>
                    <tr>
                        <th>아이디</th>
                        <th>이름</th>
                        <th>역할</th>
                        <th>변경</th>
                    </tr>
                </thead>
                <tbody id="accountList"></tbody>
            </table>
        </section>
    </div>

    <script src="js/was-config.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/admin-accounts.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미소 병원 - 문서 스캔 (관리자)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="landing-page">
    <header class="site-header">
        <a href="index.html" class="brand" style="text-decoration:none;">
            <span class="brand-mark">+</span>
            미소병원
        </a>
        <nav class="main-nav">
            <span id="navLinks"></span>
            <span class="user-chip" id="userInfo"></span>
            <button type="button" class="btn-logout" id="logoutBtn">로그아웃</button>
        </nav>
    </header>

    <div class="page-header">
        <p class="breadcrumb"><a href="index.html">홈</a> &gt; 문서 스캔 (OCR)</p>
        <h1>문서 스캔 (OCR)</h1>
    </div>

    <div class="page-body">
        <section class="panel write-section">
            <h3>진단서 / 처방전 / 영수증 이미지 업로드</h3>
            <!-- [2026-09-11] 단순 2단으로 되돌림 - 왼쪽(업로드 + 바로 아래 미리보기), 오른쪽(OCR 결과).
                 파일 정보/처리 상태 카드는 불필요하다고 판단돼 제거. -->
            <div class="ocr-layout">
                <div class="panel ocr-card">
                    <h4>문서 이미지 업로드</h4>
                    <div class="input-group">
                        <label for="scanImage">이미지 파일 (JPEG/PNG/WEBP, 5MB 이하)</label>
                        <input type="file" id="scanImage" accept="image/png,image/jpeg,image/webp">
                    </div>
                    <button type="button" id="scanButton" class="btn-primary">텍스트 추출</button>
                    <p id="scanStatus"></p>
                    <img id="scanImagePreview" class="record-detail__image" alt="선택한 원본 이미지 미리보기" style="margin-top:16px;" hidden>
                </div>

                <div class="panel ocr-card">
                    <h4>OCR 추출 결과</h4>
                    <!-- [2026-09-11] "인식 결과 미리보기"/"원문 텍스트 수정"을 버튼이 아니라 탭으로 -
                         선택된 쪽만 밑줄로 표시되고 그 탭의 내용만 보임(admin.js가 .is-active 토글). -->
                    <div class="ocr-tabs" role="tablist">
                        <button type="button" class="ocr-tab is-active" id="previewTabBtn" role="tab" aria-selected="true">인식 결과 미리보기</button>
                        <button type="button" class="ocr-tab" id="editTabBtn" role="tab" aria-selected="false">원문 텍스트 수정</button>
                    </div>
                    <div id="confidencePreview" class="ocr-preview">이미지를 추출하면 여기에 표시됩니다.</div>
                    <div class="input-group" id="resultTextGroup" hidden>
                        <textarea id="resultText" rows="8" placeholder="추출 결과가 여기에 표시됩니다."></textarea>
                    </div>
                    <!-- [2026-09-11] 저장된 문서 상세보기와 동일하게, 스캔 직후에도 라벨:값/항목표
                         구조화 미리보기를 보여줌 (민감정보는 서버가 마스킹해서 내려줌 - 원문은 위
                         "원문 텍스트 수정" 탭에서 확인). 인식 못 하면 두 컨테이너 다 비워둠(admin.js). -->
                    <div id="scanDisplayFields"></div>
                    <div id="scanItemTable"></div>
                    <div class="input-group">
                        <label for="patientSelect">연결할 환자</label>
                        <select id="patientSelect">
                            <option value="">환자를 선택하세요</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="documentTypeSelect">문서 종류</label>
                        <select id="documentTypeSelect">
                            <option value="">문서 종류를 선택하세요</option>
                            <option value="prescription">처방전</option>
                            <option value="diagnosis">진단서</option>
                            <option value="receipt">영수증</option>
                        </select>
                    </div>
                    <button type="button" id="saveButton" class="btn-primary">저장</button>
                    <p id="saveStatus"></p>
                </div>
            </div>
        </section>

        <!-- [2026-09-10] "저장된 문서"를 목록/상세로 분리 - 환자용 records.html과 같은 패턴
             (표에서 행 클릭 -> 아래 상세 패널에 원문/이미지, 여기서는 수정도 가능). -->
        <section class="panel list-section">
            <h3>저장된 문서</h3>
            <table class="board-table">
                <thead>
                    <tr><th>환자명</th><th>종류</th><th>날짜</th><th>금액</th></tr>
                </thead>
                <tbody id="documentList"></tbody>
            </table>
            <p id="documentEmptyState" hidden>저장된 문서가 없습니다.</p>
        </section>

        <section class="panel record-detail" id="documentDetail" hidden></section>
    </div>

    <script src="js/was-config.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/image-zoom.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
